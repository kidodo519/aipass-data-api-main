output:
  format: csv # csv or json
  csv:
    prefix: ""
    encoding: "utf-8-sig"
  local_output:
    enabled: true
    directory: processed-csv
  s3:
    enabled: false
    bucket: ""
    prefix: "aipass/exports"
    region: "ap-northeast-1"

date_ranges:
  history:
    start_offset_days: -2
    end_offset_days: -2
  onhand:
    start_offset_days: -1
    end_offset_days: 178
  manual:
    enabled: false
    history:
      start: ""
      end: ""
    onhand:
      start: ""
      end: ""

datasets:
  reservations:
    primary_source: reservations
    merge_key: guest_id
    output_fields:
      - reservation_id
      - check_in_date
      - reserved_at
      - reservation_status
      - updated_at
      - number_of_adults
      - number_of_children
      - total_amount
      - sales_office_company_name
      - package_plan_name
      - external_confirmation_code
      - total_stay_count
      - guest_id
      - name_first
      - name_last
      - phone_mobile
      - email
      - is_delivery_agreement
      - address
    sources:
      reservations:
        path: /reservations
        params:
          include_related_guest: 1
        date_params:
          start: check_in_date_from
          end: check_in_date_to
        field_paths:
          total_stay_count: related_guest.total_stay_count
          guest_id: related_guest.guest_id
          name_first: related_guest.name_first
          name_last: related_guest.name_last
          phone_mobile: related_guest.phone_mobile
          email: related_guest.email
          is_delivery_agreement: related_guest.is_delivery_agreement
          address: related_guest.address
        fields:
          - reservation_id
          - check_in_date
          - reserved_at
          - reservation_status
          - updated_at
          - number_of_adults
          - number_of_children
          - total_amount
          - sales_office_company_name
          - package_plan_name
          - external_confirmation_code
          - total_stay_count
          - guest_id
          - name_first
          - name_last
          - phone_mobile
          - email
          - is_delivery_agreement
          - address

  sales:
    primary_source: sales
    merge_key: reservation_id
    output_fields:
      - reservation_id
      - sales_date
      - sales_department_name
      - sales_subject_name
      - amount
      - amount_excluding_tax
      - quantity
    sources:
      sales:
        path: /sales-details
        date_params:
          start: sales_date_from
          end: sales_date_to
        field_paths:
          reservation_id: reservation.reservation_id
          sales_department_name: sales_department.sales_department_name
          sales_subject_name: sales_subject.sales_subject_name
        fields:
          - reservation_id
          - sales_date
          - sales_department_name
          - sales_subject_name
          - amount
          - amount_excluding_tax
          - quantity

  rooms:
    primary_source: rooms
    merge_key: reservation_id
    output_fields:
      - reservation_id
      - room_usage_date
      - room_number
    sources:
      rooms:
        path: /reservations
        date_params:
          start: check_in_date_from
          end: check_in_date_to
        explode: assign_rooms
        field_paths:
          reservation_id: root.reservation_id
          room_usage_date: room_usage_start_date
          room_number: room.room_number|room_number|room.number
        fields:
          - reservation_id
          - room_usage_date
          - room_number
